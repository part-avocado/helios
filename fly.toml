# Fly.io config for the teardrop central server. See README.md, "Deploy to Fly.io".
# Change app to a name of your own, and set TEARDROP_PUBLIC_URL to match.
app = "teardrop-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  TEARDROP_PUBLIC_URL = "https://teardrop-server.fly.dev"

# Accounts and submissions live on this volume. Run one machine only: the
# server keeps its data in files and locks them within one process.
[mounts]
  source = "teardrop_data"
  destination = "/data"

[processes]
  app = "server -addr :8080 -data /data -max-submission-mb 64"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
