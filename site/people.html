<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>People · teardrop</title>
	<link rel="icon" href="favicon.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&family=Instrument+Serif&display=swap">
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="nav.css">
</head>
<body>
<nav class="nav" aria-label="Main">
	<a class="brand" href="index.html"><img src="favicon.svg" alt="">teardrop</a>
	<div class="links">
		<a href="dashboard.html">Dashboard</a>
		<a href="settings.html">Settings</a>
		<a href="people.html" class="active" aria-current="page">People</a>
		<a href="docs.html" class="docs-link">Docs</a>
	</div>
	<details class="account hosted-only">
		<summary aria-label="Account menu"><span class="avatar" id="account-initial" aria-hidden="true"></span><span class="who" id="account-name"></span><svg class="chev" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
		<div class="menu">
			<div class="who-line">Signed in as<b id="account-name-full"></b></div>
			<a href="dashboard.html">Dashboard</a>
			<a href="settings.html">Settings</a>
			<a href="settings.html#account">Account</a>
			<form method="post" action="/logout"><button>Sign out</button></form>
		</div>
	</details>
</nav>

<main class="wrap dash">
	<div class="dash-head">
		<h1>People</h1>
		<span class="status" id="status"></span>
		<form class="lookup" role="search" action="person.html">
			<input name="slack" aria-label="Slack ID" placeholder="Slack ID, such as U0A06EPFV45" autocomplete="off" spellcheck="false" required>
			<button class="btn">Look up</button>
		</form>
	</div>
	<div class="panel">
		<div class="table-scroll"><table class="data people" id="people"></table></div>
	</div>
	<p class="muted fine">Only admins can open this page. Choose a person to review their computers and every report they sent.</p>
</main>
<script src="site.js"></script>
<script src="account.js"></script>
<script>
// Everyone with an account, for admins.
if (!('hosted' in document.documentElement.dataset)) location.replace('dashboard.html')
else api('/api/admin/people').then(({ people }) => {
	$('status').textContent = people.length === 1 ? '1 person' : `${people.length} people`
	$('people').innerHTML = '<tr><th>Name</th><th>Slack ID</th><th>Engaged, past year</th><th>Computers</th><th>Flagged</th><th>Last sync</th></tr>' +
		(people.map((p) => `<tr>
			<td><a href="person.html?id=${p.id}">${esc(p.name || (p.deleted_at ? 'Deleted account' : 'No name'))}</a></td>
			<td>${p.slack_id ? `<code>${esc(p.slack_id)}</code>` : '<span class="muted">none</span>'}</td>
			<td>${dur(p.engaged_seconds)}</td><td>${p.computers}</td>
			<td>${p.flagged ? `<a class="flag" href="person.html?id=${p.id}">${p.flagged}</a>` : '<span class="muted">0</span>'}</td>
			<td>${p.synced_at ? esc(ago(p.synced_at)) : '<span class="muted">never</span>'}</td>
		</tr>`).join('') || '<tr><td colspan="6" class="muted">No one has signed in yet.</td></tr>')
}).catch((e) => ($('status').textContent = e.message))
</script>
</body>
</html>
