<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title data-i18n="profile.title">Profile - teardrop</title>
	<link rel="icon" href="/favicon.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap">
	<link rel="stylesheet" href="/base.css">
	<link rel="stylesheet" href="/style.css">
	<script src="/theme.js"></script>
	<script src="/i18n.js" data-scripts="/site.js /account.js /charts.js /tables.js /profile.js"></script>
</head>
<body>
<nav class="nav" aria-label="Main" data-i18n-attr="aria-label:nav.main">
	<a class="brand" href="/"><img src="/favicon.svg" alt="">teardrop</a>
	<div class="links">
		<a href="/#what-counts" class="opt" data-i18n="nav.whatCounts">What counts</a>
		<a href="/dashboard" class="hosted-only" data-i18n="nav.dashboard">Dashboard</a>
		<a href="/settings" class="hosted-only" data-i18n="nav.settings">Settings</a>
		<a href="/review/" class="staff-only" data-i18n="nav.review">Review</a>
		<a href="/docs" class="docs-link" data-i18n="nav.docs">Docs</a>
	</div>
	<button class="theme" type="button" data-theme-toggle aria-label="Switch between dark and light" title="Switch between dark and light" data-i18n-attr="aria-label:nav.theme;title:nav.theme"><svg class="sun" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5V3M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg><svg class="moon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M13.5 9.5a5.5 5.5 0 0 1-7-7 5.5 5.5 0 1 0 7 7z"/></svg></button>
	<button class="theme lang" type="button" data-lang-toggle>日本語</button>
	<a class="btn primary small local-only" href="/login" data-i18n="nav.signIn">Sign in</a>
	<details class="account hosted-only">
		<summary aria-label="Account menu" data-i18n-attr="aria-label:nav.accountMenu"><span class="avatar" id="account-initial" aria-hidden="true"></span><span class="who" id="account-name"></span><svg class="chev" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
		<div class="menu">
			<div class="who-line"><span data-i18n="nav.signedInAs">Signed in as</span><b id="account-name-full"></b></div>
			<a href="/dashboard" data-i18n="nav.dashboard">Dashboard</a>
			<a href="/settings" data-i18n="nav.settings">Settings</a>
			<a href="/settings#profile" data-i18n="nav.profile">Profile</a>
			<a href="/review/" class="staff-only" data-i18n="nav.review">Review</a>
			<form method="post" action="/logout"><button data-i18n="nav.signOut">Sign out</button></form>
		</div>
	</details>
</nav>

<main class="wrap dash">
	<div class="dash-head">
		<div class="dash-title">
			<h1 id="title" data-i18n="profile.h1">Profile</h1>
			<p class="status-line"><span class="status" id="status"></span><span class="status" id="live-now" aria-live="polite" hidden></span></p>
		</div>
	</div>

	<div id="notice" class="empty" hidden>
		<h2 id="notice-title"></h2>
		<p class="muted" id="notice-text"></p>
		<p class="actions" id="notice-actions" hidden><button class="btn" type="button" id="notice-retry" data-i18n="common.tryAgain">Try again</button></p>
	</div>

	<!-- Until the profile arrives: the page's own shapes, so nothing jumps when it does. -->
	<div id="loading" class="loading" role="status" aria-label="Loading this profile" data-i18n-attr="aria-label:profile.loading">
		<div class="stats">
			<div class="stat"><span class="skeleton label"></span><span class="skeleton value"></span><span class="skeleton hint"></span></div>
			<div class="stat"><span class="skeleton label"></span><span class="skeleton value"></span><span class="skeleton hint"></span></div>
			<div class="stat"><span class="skeleton label"></span><span class="skeleton value"></span><span class="skeleton hint"></span></div>
			<div class="stat"><span class="skeleton label"></span><span class="skeleton value"></span><span class="skeleton hint"></span></div>
		</div>
		<div class="panels">
			<div class="panel wide"><span class="skeleton chart"></span></div>
			<div class="panel wide"><span class="skeleton chart"></span></div>
		</div>
	</div>

	<div id="content" hidden>
		<div class="stats">
			<div class="stat"><div class="label" data-i18n="common.engaged">Engaged</div><div class="value" id="s-total">-</div><div class="hint" data-i18n="profile.pastYear">in the past year</div></div>
			<div class="stat"><div class="label" data-i18n="profile.thisWeek">This week</div><div class="value" id="s-week">-</div><div class="hint" id="s-week-hint"></div></div>
			<div class="stat"><div class="label" data-i18n="common.streak">Streak</div><div class="value" id="s-streak">-</div><div class="hint" data-i18n="common.streakHint">days in a row with activity</div></div>
			<div class="stat"><div class="label" data-i18n="profile.activeDays">Active days</div><div class="value" id="s-days">-</div><div class="hint" data-i18n="profile.pastYear">in the past year</div></div>
		</div>
		<div class="panels">
			<div class="panel wide"><h2 data-i18n="common.activity">Activity</h2><div class="heatmap" id="heatmap"></div>
				<div class="legend"><span data-i18n="common.less">Less</span> <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> <span data-i18n="common.more">More</span></div></div>
			<div class="panel wide"><h2 data-i18n="common.projects">Projects</h2><div class="table-scroll"><table class="data stack" id="projects"></table></div></div>
		</div>
	</div>
</main>
<div class="tip" id="tip" role="tooltip" hidden><b></b><span></span><em></em></div>
</body>
</html>
