<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title data-i18n="login.title">Sign in - helios</title>
	<link rel="icon" href="favicon.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..500&display=swap">
	<link rel="stylesheet" href="base.css">
	<link rel="stylesheet" href="style.css">
	<script src="theme.js"></script>
	<script src="i18n.js" data-scripts="login.js"></script>
</head>
<body>
<main class="signin">
	<div>
		<div class="card">
			<a href="index.html" aria-label="helios home" data-i18n-attr="aria-label:login.home"><img class="logo" src="logo.png" alt=""></a>
			<h1 data-i18n="login.h1">Sign in to helios</h1>
			<p class="muted" data-i18n="login.lead">Your hours from every computer, in one place.</p>
			<p class="msg bad" id="error" role="alert" hidden></p>
			<a class="btn primary" id="go" href="/auth/hca" data-i18n="login.go">Sign in with Hack Club</a>
			<p class="fine muted" data-i18n="login.fine">New here? Signing in creates your account.</p>
		</div>
		<p class="back"><a href="index.html"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="login.back">Back to home</span></a></p>
		<p class="back"><button class="theme lang" type="button" data-lang-toggle>日本語</button></p>
	</div>
</main>
</body>
</html>
