	</div>
	<div class="rv-me" id="me"></div>
	<button class="rv-search" type="button" data-search title="Search people"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><span>Search</span><kbd data-keys></kbd></button>

	<div class="box"><div class="cmd plain"><code id="key-value"></code><button class="copy" type="button">Copy</button></div></div>
	<form method="dialog" class="actions"><button class="btn primary small">Done</button></form>
</dialog>
