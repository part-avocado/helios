<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title data-i18n="projects.title">Projects - helios</title>
	<link rel="icon" href="favicon.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..500&display=swap">
	<link rel="stylesheet" href="base.css">
	<link rel="stylesheet" href="style.css">
	<script src="theme.js"></script>
	<script src="i18n.js" data-scripts="site.js account.js charts.js reports.js projects.js"></script>
</head>
<body class="app">
<nav class="nav" aria-label="Main" data-i18n-attr="aria-label:nav.main">
	<a class="brand" href="index.html"><img src="favicon.svg" alt="">helios</a>
	<div class="links">
		<a href="dashboard.html" class="app-only" data-i18n="nav.dashboard">Dashboard</a>
		<a href="projects.html" class="app-only active" aria-current="page" data-i18n="nav.projects">Projects</a>
		<a href="docs.html" class="docs-link" data-i18n="nav.docs">Docs</a>
		<a href="settings.html" class="hosted-only settings-link" data-i18n="nav.settings">Settings</a>
		<a href="/review/" class="staff-only" data-i18n="nav.review">Review</a>
		<a href="https://github.com/part-avocado/helios" class="opt local-only" data-i18n="nav.github">GitHub</a>
	</div>
	<button class="theme" type="button" data-theme-toggle aria-label="Switch between dark and light" title="Switch between dark and light" data-i18n-attr="aria-label:nav.theme;title:nav.theme"><svg class="sun" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5V3M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg><svg class="moon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M13.5 9.5a5.5 5.5 0 0 1-7-7 5.5 5.5 0 1 0 7 7z"/></svg></button>
	<button class="theme lang" type="button" data-lang-toggle>日本語</button>
	<a class="btn primary small guest-only" href="login.html" data-i18n="nav.signIn">Sign in</a>
	<details class="account hosted-only">
		<summary aria-label="Account menu" data-i18n-attr="aria-label:nav.accountMenu"><span class="avatar" id="account-initial" aria-hidden="true"></span><span class="who" id="account-name"></span><svg class="chev" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
		<div class="menu">
			<div class="who-line"><span data-i18n="nav.signedInAs">Signed in as</span><b id="account-name-full"></b></div>
			<a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
			<a href="projects.html" data-i18n="nav.projects">Projects</a>
			<a href="settings.html" data-i18n="nav.settings">Settings</a>
			<a href="settings.html#account" data-i18n="nav.account">Account</a>
			<a href="/review/" class="staff-only" data-i18n="nav.review">Review</a>
			<form method="post" action="/logout"><button data-i18n="nav.signOut">Sign out</button></form>
		</div>
	</details>
</nav>
<aside class="appnav hosted-only" aria-label="Account" data-i18n-attr="aria-label:nav.account">
	<div class="who-line"><span class="avatar" id="side-initial" aria-hidden="true"></span><span><span data-i18n="nav.signedInAs">Signed in as</span><b id="side-name"></b></span></div>
	<div class="appnav-links">
		<a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
		<a href="projects.html" aria-current="page" data-i18n="nav.projects">Projects</a>
		<a href="settings.html" data-i18n="nav.settings">Settings</a>
		<a href="settings.html#account" data-i18n="nav.account">Account</a>
		<a href="/review/" class="staff-only" data-i18n="nav.review">Review</a>
	</div>
	<form method="post" action="/logout"><button data-i18n="nav.signOut">Sign out</button></form>
</aside>

<main class="wrap dash">
	<div class="ban-banner" id="ban-banner" role="alert" hidden>
		<svg viewBox="0 0 16 16" width="28" height="28" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="m3.8 3.8 8.4 8.4"/></svg>
		<div><h2 data-i18n="ban.title">This account is banned</h2><p id="ban-text"></p></div>
	</div>
	<div class="dash-head">
		<div class="dash-title">
			<h1 id="title" data-i18n="projects.h1">Your projects</h1>
			<p class="status-line"><span class="status" id="status"></span></p>
		</div>
		<div class="seg" id="range" role="group" aria-label="Time range" hidden data-i18n-attr="aria-label:dash.timeRange">
			<button data-days="7" data-i18n="dash.range7">7 days</button>
			<button data-days="30" aria-pressed="true" data-i18n="dash.range30">30 days</button>
			<button data-days="365" data-i18n="dash.rangeYear">Year</button>
		</div>
	</div>

	<!-- Nothing synced or found yet: where to set it up. -->
	<div id="empty" class="empty" hidden>
		<h2 data-i18n="projects.empty.h">No projects yet</h2>
		<p class="muted" id="empty-text"></p>
	</div>

	<!-- Nothing to show, such as when the stats could not be read. -->
	<div id="notice" class="empty" hidden>
		<h2 id="notice-title"></h2>
		<p class="muted" id="notice-text"></p>
		<p class="actions" id="notice-actions" hidden><button class="btn" type="button" id="notice-retry" data-i18n="common.tryAgain">Try again</button></p>
	</div>

	<!-- Until the first answer arrives: the page's own shapes, so nothing jumps when the projects do. -->
	<div id="loading" class="loading" role="status" aria-label="Loading your projects" data-i18n-attr="aria-label:projects.loading">
		<div class="project-tools"><span class="skeleton search"></span></div>
		<div class="project-grid">
			<div class="project-card"><span class="skeleton label"></span><span class="skeleton value"></span><span class="skeleton hint"></span><span class="skeleton hint"></span></div>
			<div class="project-card"><span class="skeleton label"></span><span class="skeleton value"></span><span class="skeleton hint"></span><span class="skeleton hint"></span></div>
			<div class="project-card"><span class="skeleton label"></span><span class="skeleton value"></span><span class="skeleton hint"></span><span class="skeleton hint"></span></div>
		</div>
	</div>

	<div id="content" hidden>
		<div class="project-tools">
			<label class="project-search">
				<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
				<input type="search" id="search" autocomplete="off" spellcheck="false" placeholder="Search projects" aria-label="Search projects" data-i18n-attr="placeholder:projects.search;aria-label:projects.search">
			</label>
			<span class="muted" id="count" aria-live="polite"></span>
		</div>
		<div class="project-grid" id="cards"></div>
		<p class="note-bar" id="none" hidden></p>
	</div>
</main>
</body>
</html>
