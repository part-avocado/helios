# Pushing a tag such as v0.1.0 publishes a release with the binaries and
# checksums that install.sh and install.ps1 download.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - run: scripts/build-release.sh dist "$GITHUB_REF_NAME"
      # The release notes are this version's section of CHANGELOG.md, or GitHub's own when it has none.
      - run: awk -v v="## $GITHUB_REF_NAME" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
      - run: |
          if [ -s notes.md ]; then notes="--notes-file notes.md"; else notes="--generate-notes"; fi
          gh release create "$GITHUB_REF_NAME" dist/* install.sh install.ps1 $notes
        env:
          GH_TOKEN: ${{ github.token }}
